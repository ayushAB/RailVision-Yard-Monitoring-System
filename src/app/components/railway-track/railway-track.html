<div class="track-wrapper">

    <svg
        class="track-svg"
        viewBox="0 0 1200 320">

        <!-- Rails -->

        <line
            x1="60"
            y1="120"
            x2="1140"
            y2="120"
            class="rail"/>

        <line
            x1="60"
            y1="150"
            x2="1140"
            y2="150"
            class="rail"/>

        <!-- Sleepers -->

        @for(s of sleepers; track s){

        <line

            [attr.x1]="80 + s*25"

            y1="105"

            [attr.x2]="80 + s*25"

            y2="165"

            class="sleeper"/>

        }

        <!-- Sensor S1 -->

        <circle
            cx="100"
            cy="80"
            r="18"
            class="sensor"/>

        <text
            x="92"
            y="86"
            class="sensor-text">

            S1

        </text>

        <!-- Sensor S2 -->

        <circle
            cx="1100"
            cy="80"
            r="18"
            class="sensor"/>

        <text
            x="1092"
            y="86"
            class="sensor-text">

            S2

        </text>

        <!-- Red Zone -->

        <rect

            x="850"

            y="175"

            width="250"

            height="10"

            class="red-zone"/>

        <!-- Green Zone -->

        <rect

            x="100"

            y="175"

            width="750"

            height="10"

            class="green-zone"/>

        <!-- Train -->

        <g
            [attr.transform]="'translate(' + trainX() + ',95)'">

            <rect
                width="90"
                height="40"
                rx="6"
                class="train"/>

            <circle cx="20" cy="42" r="5" class="wheel"/>
            <circle cx="70" cy="42" r="5" class="wheel"/>

        </g>

    </svg>

</div>
