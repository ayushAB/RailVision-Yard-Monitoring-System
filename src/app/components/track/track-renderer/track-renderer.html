<div class="track-card">
  <div class="track-header">
    <span>{{ track().name }}</span>

    <span>{{ track().length }} m</span>
  </div>

  <div class="track-meta">
    <div class="meta-item">
      <span>Position</span>
      <strong>{{ currentPosition().toFixed(1) }} m</strong>
    </div>
    <div class="meta-item">
      <span>Status</span>
      <strong>{{ track().train.status }}</strong>
    </div>
    <div class="meta-item">
      <span>Direction</span>
      <strong>{{ track().train.direction }}</strong>
    </div>
  </div>

  <div class="track-stage">
    <svg #trackSvg class="track-svg" viewBox="0 0 1200 280" preserveAspectRatio="none">
      <defs>
        <pattern
          id="redPattern"
          width="12"
          height="12"
          patternUnits="userSpaceOnUse"
          patternTransform="rotate(45)"
        >
          <rect width="12" height="12" fill="#b91c1c" />

          <line x1="0" y1="0" x2="0" y2="12" stroke="#ff4444" stroke-width="5" />
        </pattern>
      </defs>

      <!-- SENSOR POLES -->

      @for (sensor of sensors(); track sensor.id) {
        <g [attr.transform]="'translate(' + sensorX(sensor.position) + ',0)'">
          <circle cx="0" cy="35" r="18" class="sensor-circle" />

          <text x="0" y="40" class="sensor-label">
            {{ sensor.id }}
          </text>

          <line x1="0" y1="53" x2="0" y2="105" class="sensor-pole" />

          <text x="0" y="18" class="distance-label">{{ sensor.position }}m</text>
        </g>
      }

      <!-- RAIL -->

      <line x1="40" y1="120" x2="1160" y2="120" class="rail" />

      <line x1="40" y1="150" x2="1160" y2="150" class="rail" />

      <!-- SLEEPERS -->

      @for (s of sleepers; track s) {
        <line [attr.x1]="50 + s * 24" y1="105" [attr.x2]="50 + s * 24" y2="165" class="sleeper" />
      }

      <!-- DEAD END -->

      <rect x="1148" y="98" width="10" height="74" class="dead-end" />

      <!-- GREEN ZONE -->

      <rect x="40" y="205" width="900" height="12" rx="6" class="green-zone" />

      <!-- RED ZONE -->

      <rect x="940" y="205" width="220" height="12" rx="6" fill="url(#redPattern)" />

      <!-- SCALE -->

      @for (i of scale; track i) {
        <text [attr.x]="40 + i * 112" y="250" class="scale">
          {{ i * 10 }}
        </text>
      }
    </svg>

    <app-train [position]="trainX()" [x]="trainX()">> </app-train>
  </div>
</div>
