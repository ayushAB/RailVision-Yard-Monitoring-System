<div class="train" [style.transform]="'translate3d(' + (x() - 160) + 'px,0,0)'">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 140" preserveAspectRatio="xMidYMid meet">
    <defs>
      <linearGradient id="bodyGrad" x1="0" x2="0" y1="0" y2="1">
        <stop offset="0%" stop-color="#4fa3ff" />
        <stop offset="100%" stop-color="#1f6fd8" />
      </linearGradient>
      <linearGradient id="carGrad" x1="0" x2="0" y1="0" y2="1">
        <stop offset="0%" stop-color="#2f80ed" />
        <stop offset="100%" stop-color="#1660cc" />
      </linearGradient>
      <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
        <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.35" />
      </filter>
    </defs>

    <!-- Ground shadow -->
    <ellipse cx="260" cy="118" rx="160" ry="8" fill="#000" opacity="0.16" />

    <!-- Freight wagons (three) -->
    <g filter="url(#shadow)">
      <!-- Wagon 1 -->
      <g transform="translate(40,44)">
        <rect x="0" y="0" width="150" height="64" rx="4" fill="#2b6b87" />
        <g fill="#1f2a30" opacity="0.1">
          <rect x="8" y="8" width="12" height="48" />
          <rect x="30" y="8" width="12" height="48" />
          <rect x="52" y="8" width="12" height="48" />
          <rect x="74" y="8" width="12" height="48" />
          <rect x="96" y="8" width="12" height="48" />
        </g>
        <rect x="6" y="48" width="138" height="6" fill="#162228" />
      </g>

      <!-- Wagon 2 -->
      <g transform="translate(198,44)">
        <rect x="0" y="0" width="150" height="64" rx="4" fill="#2b6b87" />
        <g fill="#1f2a30" opacity="0.1">
          <rect x="8" y="8" width="12" height="48" />
          <rect x="30" y="8" width="12" height="48" />
          <rect x="52" y="8" width="12" height="48" />
          <rect x="74" y="8" width="12" height="48" />
          <rect x="96" y="8" width="12" height="48" />
        </g>
        <rect x="6" y="48" width="138" height="6" fill="#162228" />
      </g>

      <!-- Wagon 3 -->
      <g transform="translate(356,44)">
        <rect x="0" y="0" width="150" height="64" rx="4" fill="#2b6b87" />
        <g fill="#1f2a30" opacity="0.1">
          <rect x="8" y="8" width="12" height="48" />
          <rect x="30" y="8" width="12" height="48" />
          <rect x="52" y="8" width="12" height="48" />
          <rect x="74" y="8" width="12" height="48" />
          <rect x="96" y="8" width="12" height="48" />
        </g>
        <rect x="6" y="48" width="138" height="6" fill="#162228" />
      </g>

      <!-- Small leading loco/engine nose to suggest a locomotive -->
      <g transform="translate(516,36)">
        <rect x="-24" y="6" width="44" height="54" rx="4" fill="url(#bodyGrad)" />
        <rect x="-18" y="16" width="28" height="28" rx="3" fill="#e6f6ff" opacity="0.95" />
      </g>
    </g>

    <!-- Couplers and connecting rods -->
    <g fill="#6b6b6b">
      <rect x="120" y="40" width="8" height="4" rx="2" />
      <rect x="214" y="40" width="8" height="4" rx="2" />
      <rect x="298" y="48" width="6" height="4" rx="2" />
    </g>

    <!-- Wheels (two bogies per wagon) -->
    <g fill="#2a2f33">
      <!-- Wagon1 bogies -->
      <circle cx="70" cy="118" r="12" />
      <circle cx="112" cy="118" r="12" />

      <!-- Wagon2 bogies -->
      <circle cx="230" cy="118" r="12" />
      <circle cx="272" cy="118" r="12" />

      <!-- Wagon3 bogies -->
      <circle cx="390" cy="118" r="12" />
      <circle cx="432" cy="118" r="12" />
    </g>

    <g fill="#9aa0a6">
      <circle cx="70" cy="118" r="4" />
      <circle cx="112" cy="118" r="4" />
      <circle cx="230" cy="118" r="4" />
      <circle cx="272" cy="118" r="4" />
      <circle cx="390" cy="118" r="4" />
      <circle cx="432" cy="118" r="4" />
    </g>
  </svg>
</div>
