<div class="kpi-card">

    <div
        class="icon-box"
        [style.background]="color() + '20'">

        <i
            [class]="icon()"
            [style.color]="color()">
        </i>

    </div>

    <div class="details">

        <div class="title">

            {{title()}}

        </div>

        <div class="value">

            {{value()}}

        </div>

    </div>

</div>
